<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombis: La última obstetra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0;background:#05060c;overflow:hidden;font-family:Impact,"Arial Narrow",Arial,sans-serif;color:#fff;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none}
h1{position:absolute;left:4vw;top:5vh;margin:0;font-size:min(15vw,112px);transform:rotate(-4deg);text-shadow:0 0 20px #c00,3px 3px 0 #a00;line-height:.9;letter-spacing:2px}
#sub{position:absolute;left:5vw;top:calc(5vh + min(15vw,112px));font-size:min(7vw,44px);line-height:1;color:#fff}
#sub b{display:block;font-size:min(10vw,64px);color:#ff6fa5;text-shadow:0 0 14px #f03}
#tag{position:absolute;left:4vw;bottom:6vh;font:600 min(4.2vw,22px) Arial,sans-serif;text-shadow:0 2px 6px #000}
#tag b{color:#ff4f86}
#menu{position:absolute;right:4vw;bottom:12vh;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#menu button{background:rgba(0,0,0,.45);color:#fff;border:0;font:600 min(4.5vw,20px) Arial,sans-serif;padding:10px 38px 10px 16px;text-align:left;cursor:pointer;letter-spacing:1px}
#menu button:first-child{background:linear-gradient(90deg,#e8294f,#ff5c7d)}
#menu button:hover{background:#e8294f}
#yr{position:absolute;right:4vw;bottom:4vh;font:12px Arial,sans-serif;opacity:.6}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:3vh;font:12px Arial,sans-serif;opacity:.6}
#hud{position:fixed;left:3vw;top:2vh;font:600 15px Arial,sans-serif;display:none;text-shadow:0 1px 4px #000}
#bar{width:200px;height:12px;background:#222;border:1px solid #888;margin-top:4px}
#bar i{display:block;height:100%;background:#e8294f;width:100%}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);font:18px/1.5 Arial,sans-serif;text-align:center;padding:20px;cursor:pointer}
#cover{position:fixed;inset:0;background:#05060c;display:flex;align-items:center;justify-content:center;z-index:5}
#wrap{position:relative;width:min(100vw,calc(100vh*1.5000));aspect-ratio:1536/1024}
#wrap img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;left:70%;width:21%;height:6.4%;background:transparent;border:0;cursor:pointer;padding:0}
.hot:hover{background:rgba(255,255,255,.08)}
#aud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:9;display:flex;gap:6px;font:12px Arial,sans-serif}
#aud button,#aud label{background:rgba(0,0,0,.6);color:#fff;border:1px solid #666;padding:6px 10px;cursor:pointer;border-radius:4px}
#panel{z-index:10}
#pad{position:fixed;left:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;align-items:center;gap:6px;z-index:8}
#pad div{display:flex;gap:6px}
#act{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;gap:8px;z-index:8}
#inv{font-size:12px;margin-top:6px}#lvl{color:#ff9fbd}
.qb{margin:4px 0;padding:8px 14px;background:#222;color:#fff;border:1px solid #a01030;cursor:pointer;font:16px Arial,sans-serif;width:100%}
#pad button,#act button{width:62px;height:62px;font-size:24px;background:rgba(0,0,0,.55);color:#fff;border:1px solid #888;border-radius:50%;touch-action:none;user-select:none}

    if(mx||mz){const l=Math.hypot(mx,mz);let nx=p.x+mx/l*3*dt,nz=p.z+mz/l*3*dt;
      doors.forEach(o=>{if(o.open)return;if(p.z>o.z+.01&&nz<o.z+.8){if(inv.k>0){inv.k--;o.open=true;o.m.visible=false;score+=25;say('Puerta abierta con la tarjeta de acceso')}else{nz=Math.max(nz,o.z+.8);say('Puerta bloqueada: busca la tarjeta de acceso')}}});
      const ez=-c.L+2;if(nz<ez&&c.kit&&!inv.kit){nz=ez;say('Necesitas el kit obstétrico para salir del nivel')}
      p.x=Math.max(-3.3,Math.min(3.3,nx));p.z=Math.max(-c.L+1,Math.min(6,nz));val.g.rotation.y=Math.atan2(mx,mz);
      val.legs.forEach((l2,i)=>l2.rotation.x=Math.sin(t*9+i*3.14)*.6)}else val.legs.forEach(l2=>l2.rotation.x=0);
    if(keys.h){if(!hDown){hDown=1;if(inv.b>0&&energy<100){inv.b--;energy=Math.min(100,energy+40);say('Botiquín usado: +40 energía')}else say(inv.b?'Tu energía ya está al máximo':'No tienes botiquines')}}else hDown=0;
    if(keys[' ']&&atk<=0){atk=.7;let n=0;zs.forEach(z=>{if(z.on&&Math.hypot(z.g.position.x-p.x,z.g.position.z-p.z)<1.8){z.on=false;z.g.visible=false;n++;score+=20}});
      if(n){energy-=2;say('Eliminaste '+n+' zombi'+(n>1?'s':''))}else say('Ataque fallido: acércate más')}
    if(energy<=0){done=true;lives--;
      if(lives>0)show(BOX+TT+'VALERIA HA CAÍDO…</b><br><br>Pierdes una vida. Vidas restantes: '+lives+'<br><small>(toca para reintentar el nivel)</small></div>',()=>{done=false;energy=100;setupLevel(lv)});
      else show(BOX+TT+'GAME OVER</b><br><br>Valeria no llegó al refugio.<br>Puntos: '+score+'<br><small>(toca para volver)</small></div>',()=>{reset()})}
    else if(p.z<-c.L+2)levelDone()}
  if(playing){$('bar').firstChild.style.width=Math.max(0,energy)+'%';$('lvl').textContent='Nivel '+(lv+1)+'/4 · '+c.n+' · Vidas: '+lives+' · Puntos: '+score;
    $('inv').textContent='Tarjetas: '+inv.k+'   Botiquines: '+inv.b+'   Kit obstétrico: '+(inv.kit?'SÍ':'no')}
  if(playing){cam.position.lerp(new T.Vector3(p.x*.6,2.6,p.z+4.6),.1);cam.lookAt(p.x,1.3,p.z-2)}
  else{const tx=1.2,ty=1.35,tz=1.5,d=4.6,y=yaw+Math.sin(t*.3)*.04;cam.position.set(tx+Math.sin(y)*Math.cos(pitch)*d,ty+Math.sin(pitch)*d+.2,tz+Math.cos(y)*Math.cos(pitch)*d);cam.lookAt(tx,ty,tz)}
  R.render(S,cam)}
loop();
</script></body></html>
